[project]
name = "banorte-ir-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.15",
    "mcp>=2.3.0",
    "openinference-instrumentation-langchain>=0.1.79",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
    "sse-starlette>=3.5.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "reportlab>=4.0",
]
